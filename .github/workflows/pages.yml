name: Deploy site

# Tanıtım sitesini (umbra/site) GitHub Pages'e yayınlar.
# Ayarlar → Pages → Source: "GitHub Actions" seçili olmalı.

on:
  push:
    branches: [ main ]
    paths:
      - "umbra/site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: umbra/site
      - id: deployment
        uses: actions/deploy-pages@v4
