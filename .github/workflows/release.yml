name: Release

# Etiket (v1.0.0 gibi) push edilince kurulum + taşınabilir paketleri derler
# ve GitHub Release'e ekler. Elle de çalıştırılabilir (artefakt olarak).

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sürümü belirle
        id: ver
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -match '^v\d') { $ver = $tag.Substring(1) } else { $ver = "1.0.0" }
          "version=$ver" >> $env:GITHUB_OUTPUT

      - name: Derle ve paketle
        shell: pwsh
        run: ./umbra/host/package.ps1 -Version "${{ steps.ver.outputs.version }}"

      - name: Release'e yükle
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            umbra/host/dist/Umbra-Setup-*.exe
            umbra/host/dist/Umbra-Portable-*.zip

      - name: Artifakt olarak yükle
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: umbra-packages
          path: |
            umbra/host/dist/Umbra-Setup-*.exe
            umbra/host/dist/Umbra-Portable-*.zip

  # Android istemci (APK). Masaustu paketleri hazir olduktan sonra calisir ki
  # ayni Release'e yukleyebilsin.
  apk:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Sürümü belirle
        id: ver
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ "$tag" == v* ]]; then ver="${tag#v}"; else ver="1.0.0"; fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"

      - name: APK derle
        working-directory: umbra/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug assembleRelease --no-daemon --stacktrace \
            -PversionName=${{ steps.ver.outputs.version }}

      - name: APK'ları yeniden adlandır
        shell: bash
        run: |
          mkdir -p apk-out
          cp umbra/android/app/build/outputs/apk/release/app-release.apk "apk-out/Umbra-Android-${{ steps.ver.outputs.version }}.apk"
          cp umbra/android/app/build/outputs/apk/debug/app-debug.apk "apk-out/Umbra-Android-${{ steps.ver.outputs.version }}-debug.apk"

      - name: Release'e yükle
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: apk-out/*.apk

      - name: Artifakt olarak yükle
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: umbra-android-apk
          path: apk-out/*.apk
